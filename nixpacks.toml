[phases.setup]
nixPkgs = ['python312', 'nodejs-18_x', 'npm-9_x']

[phases.install]
cmds = [
  'cd backend && pip install -r requirements.txt',
  'cd frontend && npm install'
]

[phases.build]
cmds = ['cd frontend && npm run build']

[start]
cmd = 'cd backend && gunicorn app:app --bind 0.0.0.0:$PORT'
